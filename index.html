<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雷氏风味斋 · 电子菜单</title>
  <!-- ========== Favicon ========== -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="site.webmanifest">
  
  <!-- ========== 字体 ========== -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- ========== 样式（引用外部文件 style.css） ========== -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="menu-container">
    <header class="header">
      <h1 class="restaurant-name">雷氏风味斋</h1>
      <div class="divider"></div>
      <p class="slogan">私房小菜 · 挚友同欢</p>
      
      <!-- ============ 使用提示 ============ -->
      <div class="usage-tip">
        点击菜品可多选，底部"点餐"按钮一键复制
      </div>
    </header>
    
    <!-- ============ 菜单内容（由 app.js 从 menu-data.json 动态渲染） ============ -->
    
    <!-- ============ 页脚 ============ -->
    <footer class="footer">
      <p class="highlight" style="margin-top:8px; font-weight:500">✨ 所有菜品均可根据口味调整 | 部分菜品需提取预订</p>
    </footer>
  </div>
  
  <!-- ============ 底部已选菜品区域（固定在页面底部） ============ -->
  <section class="selected-bottom" id="selectedBottom">
    <div class="selected-title">
      <span>✓ 已选菜品</span>
      <span class="selected-count" id="selectedCount">0</span>
    </div>
    <div class="selected-list" id="selectedList">
      <span class="selected-empty">暂未选择菜品</span>
    </div>
    <div class="action-buttons">
      <button class="btn btn-clear" onclick="clearSelection()">🗑️ 清空</button>
      <button class="btn btn-share" onclick="shareSelection()">📱 点餐</button>
    </div>
  </section>
  
  <!-- ========== 逻辑（引用外部文件 app.js） ========== -->
  <script src="app.js"></script>
</body>
</html>
